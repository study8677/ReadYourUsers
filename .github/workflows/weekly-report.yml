name: Weekly Multi-Product Observatory

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repo (e.g. anthropics/claude-code). Leave empty for all.'
        required: false
        default: ''
      max_pages:
        description: 'Max pages to fetch per repo (empty = workflow default)'
        required: false
        default: ''
      deploy_only:
        description: 'Skip pipeline and deploy Pages from committed reports only'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run pipeline
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.READYOURUSERS_GITHUB_TOKEN }}
          READYOURUSERS_GITHUB_TOKEN: ${{ secrets.READYOURUSERS_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL || 'https://router.teamolab.com/v1' }}
          OPENROUTER_HTTP_REFERER: ${{ vars.OPENROUTER_HTTP_REFERER || format('{0}/{1}', github.server_url, github.repository) }}
          OPENROUTER_APP_TITLE: ${{ vars.OPENROUTER_APP_TITLE || 'ReadYourUsers' }}
          LLM_PROVIDER: openai
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL || 'TeamoRouter-free' }}
          AGGREGATION_MODEL: ${{ vars.AGGREGATION_MODEL || 'TeamoRouter-free' }}
        run: |
          ARGS="${{ github.event.inputs.repo }}"
          MAX_PAGES_INPUT="${{ github.event.inputs.max_pages }}"
          MAX_PAGES_DEFAULT="${{ vars.DEFAULT_FETCH_MAX_PAGES || '1' }}"
          MAX_PAGES="$MAX_PAGES_INPUT"
          if [ -z "$MAX_PAGES" ]; then
            MAX_PAGES="$MAX_PAGES_DEFAULT"
          fi
          if [ -n "$MAX_PAGES" ]; then
            # Each step may have partial failures (e.g. empty repos) — continue to next step
            # --parallel: process multiple repos concurrently for speed
            npx tsx src/cli.ts fetch $ARGS --max-pages "$MAX_PAGES" --parallel 5 --verbose || true
            npx tsx src/cli.ts analyze $ARGS --parallel 5 --verbose || true
            npx tsx src/cli.ts aggregate $ARGS --parallel 5 --verbose || true
            npx tsx src/cli.ts generate $ARGS --verbose || true
          else
            npx tsx src/cli.ts run $ARGS --verbose
          fi

      - name: Build Pages site
        run: npm run site:build

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aggregated/ reports/ README.md
          if [ -f README.zh.md ]; then
            git add README.zh.md
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(date -u +%Y-W%V)
            git commit -m "chore: weekly report ${WEEK} [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy-pages:
    needs: generate-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
